<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Índice da Tag: Nome da Tag</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }
        h1 {
            color: #2c3e50;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }
        .post-list {
            list-style: none;
            padding: 0;
        }
        .post-item {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #f0f0f0;
        }
        .post-title {
            font-size: 1.2rem;
            color: #3498db;
            text-decoration: none;
            font-weight: bold;
        }
        .post-title:hover {
            text-decoration: underline;
        }
        .post-date {
            font-size: 0.85rem;
            color: #7f8c8d;
            margin-top: 5px;
        }
        .loading {
            font-style: italic;
            color: #666;
        }
    </style>
</head>
<body>

    <h1 id="tag-heading">Posts sobre: <span id="tag-name">Carregando...</span></h1>
    
    <div id="content">
        <p class="loading">Buscando artigos...</p>
        <ul id="posts-container" class="post-list"></ul>
    </div>

    <script>
        // CONFIGURAÇÃO
        const BLOG_URL = 'https://a-grande-onda.blog.br'; // Substitua pela URL do seu blog
        const TARGET_TAG = 'NomeDaTag'; // Substitua exatamente pela tag desejada

        document.getElementById('tag-name').textContent = TARGET_TAG;
        document.getElementById('tag-heading').innerText = Posts sobre: ${TARGET_TAG};

        // Função para buscar os posts usando o feed JSON do Blogger
        async function fetchPostsByTag() {
            const container = document.getElementById('posts-container');
            const loadingText = document.querySelector('.loading');

            try {
                // Endpoint do feed do Blogger filtrando por categoria/tag
                const response = await fetch(${BLOG_URL}/feeds/posts/summary/-/${encodeURIComponent(TARGET_TAG)}?alt=json&max-results=50);
                const data = await response.json();
                
                container.innerHTML = ''; // Limpa o loading

                if (!data.feed.entry || data.feed.entry.length === 0) {
                    container.innerHTML = '<li>Nenhum post encontrado com esta tag.</li>';
                    return;
                }

                data.feed.entry.forEach(entry => {
                    const title = entry.title.$t;
                    const date = new Date(entry.published.$t).toLocaleDateString('pt-BR');
                    
                    // Encontra o link de leitura (rel="alternate")
                    let link = '#';
                    for (let i = 0; i < entry.link.length; i++) {
                        if (entry.link[i].rel === 'alternate') {
                            link = entry.link[i].href;
                            break;
                        }
                    }

                    // Cria os elementos HTML para cada post
                    const li = document.createElement('li');
                    li.className = 'post-item';
                    
                    li.innerHTML = `
                        <a href="${link}" class="post-title" target="_blank">${title}</a>
                        <div class="post-date">Publicado em: ${date}</div>
                    `;
                    
                    container.appendChild(li);
                });

            } catch (error) {
                console.error('Erro ao carregar os posts:', error);
                loadingText.textContent = 'Ocorreu um erro ao carregar os posts.';
            }
        }

        fetchPostsByTag();
    </script>

</body>
</html>
