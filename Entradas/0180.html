<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/x-icon" href="/Imagens/favicon.png">

    <meta property="og:site_name" content="A Grande Onda">
    <meta property="og:title" content="Quero-querinhos">
    <meta property="og:description" content="Altos e baixos da vida com A Grande Onda." />
    <meta property="og:image" itemprop="image" content="https://a-grande-onda.github.io/Imagens/banner1200x630.jpg" />
    <meta property="og:type" content="https://a-grande-onda.blog.br/" />

    <title>Quero-querinhos</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body, html {
            min-height: 100vh; 
            margin: 0;
            display: flex;
            justify-content: center; 
            align-items: flex-start;     
            background-color: #f0f0f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.7;
        }

        .container {
            width: 90%;
            max-width: 750px;
            padding: 40px 50px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: left;
            margin: 40px auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container-imagem {
            text-align: center;
            margin: 20px 0;
            width: 100%; /* Garante que o container da imagem ocupe toda a largura disponível */
        }

        /* AJUSTE DA IMAGEM RESPONSIVA AQUI */
        .container-imagem img {
            max-width: 100%;
            height: auto;
            border-radius: 4px; /* Opcional: deixa as bordas suavemente arredondadas combinando com o layout */
            display: block;
            margin: 0 auto;
            transition: transform 0.2s ease; /* Efeito suave opcional ao passar o mouse */
        }

        /* Opcional: Adiciona um efeito visual e muda o cursor para indicar que é clicável */
        .container-imagem a {
            display: inline-block;
            max-width: 100%;
        }
        
        .container-imagem a:hover img {
            transform: scale(1.01); /* Leve zoom ao passar o mouse */
            filter: brightness(0.9); /* Escurece sutilmente */
        }

        p {
            width: 100%;
            margin-bottom: 20px;
            color: #333;
            font-size: 1.1rem;
        }

        h1, h3 {
            text-align: center;
        }

        h1 {
            color: #1a1a1a;
            margin-bottom: 10px;
            font-size: 2.5rem;
            line-height: 1.2;
        }

        h3 {
            font-weight: normal;
            color: #666;
            border-bottom: 1px solid #eee;
            padding-bottom: 20px;
            margin-bottom: 30px;
            font-size: 1.2rem;
            width: 100%;
        }

        h2 {
            text-align: center; 
            margin-top: 40px;
            color: #222;
        }

        table {
            margin: 20px auto; 
            border-collapse: collapse;
            width: 100%;
            max-width: 500px; 
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: #f8f8f8;
        }

        ul {
            margin-bottom: 25px;
            width: 100%;
        }

        li {
            margin-bottom: 10px;
            color: #222;
        }

        li p {
            font-weight: normal;
            margin-bottom: 5px;
        }

        .btn-retornar {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 24px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.95rem;
            text-decoration: none;
            transition: 0.3s;
            background: transparent;
            border: 2px solid #7cb382;
            color: #7cb382;
            cursor: pointer;
            margin-top: 25px;
            margin-bottom: 10px;
        }

        .btn-retornar:hover {
            background: #7cb382;
            color: #fff;
            text-decoration: none;
        }

        @media (max-width: 600px) {
            .container {
                width: 95%;
                padding: 25px 20px;
                margin: 20px auto;
            }
            
            h1 {
                font-size: 1.8rem;
            }

            h3 {
                font-size: 1rem;
                padding-bottom: 15px;
            }

            p {
                font-size: 1rem;
            }

            table {
                width: 100%; 
            }

            .btn-retornar {
                padding: 8px 20px;
                font-size: 0.85rem;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Quero-querinhos</h1>
        <h3>17/10/2026 Registros</h3>

<h2>Quero-quero e Quero-querinhos</h2>
<p>Localização - Grama dos fundos do pátio do Colégio Estadual Sertãozinho, Matinhos - PR</p>

        <div class="container-imagem">
            <a href="/Imagens/queroqerinhos.jpg" target="_blank" rel="noopener noreferrer">
                <img src="/Imagens/queroqerinhos.jpg" alt="Quarto">
            </a>
        </div>

        <a href="/index.html" class="btn-retornar">Voltar para o Início</a>
    </div>
</body>
</html>
